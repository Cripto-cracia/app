name: criptocracia_app
description: "Cripto-cracia: Anonymous voting powered by Nostr and blind signatures."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Cryptography
  crypto: ^3.0.6
  elliptic: ^0.3.11

  # Blind RSA signatures (grunch's fork)
  blind_rsa_signatures:
    git:
      url: https://github.com/grunch/blind_rsa_signatures_dart.git
      ref: main

  # Nostr protocol
  dart_nostr: ^9.1.1

  # NIP-59 Gift Wrap (grunch's fork)
  nip59:
    git:
      url: https://github.com/grunch/nip59-dart.git
      ref: main

  # State management
  provider: ^6.1.2

  # BIP39 mnemonic generation
  bip39: ^1.0.6

  # Bech32 encoding (NIP-19)
  bech32: ^0.2.2

  # BIP32/BIP44 HD key derivation
  blockchain_utils: ^3.0.0

  # Secure storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  device_info_plus: ^10.1.2

  # App info
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
